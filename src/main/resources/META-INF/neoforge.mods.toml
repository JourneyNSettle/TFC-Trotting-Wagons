modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
    modId="${mod_id}"
    version="${mod_version}"
    displayName="${mod_name}"
    authors="${mod_authors}"
    description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    mandatory=true
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="trotting_wagons"
    type="required"
    mandatory=true
    versionRange="[0.9.3,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="tfc"
    type="required"
    mandatory=true
    versionRange="[4.2.6,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="tfc_items"
    type="required"
    mandatory=true
    versionRange="[1.2.1,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="tfc_metal_tools"
    type="required"
    mandatory=true
    versionRange="[1.0.5,)"
    ordering="AFTER"
    side="BOTH"

# GeckoLib and BoneHitboxLib are required by trotting_wagons, so they stay on that mod.
[[dependencies.${mod_id}]]
    modId="afc"
    type="optional"
    mandatory=false
    versionRange="[2.0.0,)"
    ordering="AFTER"
    side="BOTH"
